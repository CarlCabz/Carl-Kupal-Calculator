<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multo Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: url('eyy.gif') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      backdrop-filter: blur(6px);
      overflow: hidden;
      cursor: url('ghost-cursor.png'), auto;
      transition: 0.3s;
    }

    body.shake {
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translate(1px, -2px) rotate(-1deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
    }

    .calculator-container {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 2;
    }

    .calculator {
      background: linear-gradient(145deg, #1b1b1b, #101010);
      border: 2px solid rgba(255, 0, 0, 0.3);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.2), 0 0 20px rgba(0, 255, 255, 0.05);
      text-align: center;
      position: relative;
    }

    #display {
      width: 100%;
      padding: 16px;
      font-size: 2rem;
      text-align: right;
      border-radius: 10px;
      border: none;
      background: #000;
      color: #00ffc3;
      box-shadow: inset 0 0 5px #00ffc3;
      margin-bottom: 20px;
      font-family: monospace;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 18px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #232323;
      color: #eeeeee;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    button:hover, button.pressed {
      background: #444;
      transform: scale(1.08);
      box-shadow: 0 0 12px #ff0000;
    }

    .clear-btn { background: #6a0000; grid-column: 1 / 3; }
    .equal-btn { background: #cc0000; grid-column: 3 / 5; }
    .equal-btn:hover, .clear-btn:hover { background: #ff4444; }

    .multo-lyrics {
      display: none;
      margin-top: 25px;
      color: #ffaaaa;
      font-style: italic;
      font-size: 0.9rem;
      font-family: 'Creepster', cursive;
      animation: fadeIn 3s forwards;
      text-align: center;
    }

    .ghost {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      opacity: 0.6;
      display: none;
      animation: floatGhost 3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes floatGhost {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translate(-50%, -30%) scale(1.2); opacity: 0; }
    }

    #flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      z-index: 999;
      pointer-events: none;
    }

    body.haunted {
      background: radial-gradient(circle, #000 60%, #5c0000 100%);
      filter: brightness(0.6);
    }

    .glitch { animation: glitch 0.3s infinite; }
    @keyframes glitch {
      0% { text-shadow: 2px 2px red; }
      20% { text-shadow: -2px 2px cyan; }
      40% { text-shadow: 2px -2px lime; }
      60% { text-shadow: -2px -2px yellow; }
      100% { text-shadow: 2px 2px red; }
    }

    .dark-toggle {
      margin-top: 10px;
      color: #aaa;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .history-box {
      margin-top: 20px;
      background-color: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 10px;
      text-align: left;
      font-size: 0.9rem;
    }
    .history-box h4 {
      margin: 0 0 10px 0;
      font-family: 'Creepster', cursive;
      color: #ffdddd;
    }
    #historyList {
      list-style: none;
      padding-left: 10px;
      max-height: 120px;
      overflow-y: auto;
    }
    #historyList li {
      margin-bottom: 5px;
      color: #ffaaff;
      font-family: monospace;
    }
    .history-box button {
      background: #6a0000;
      color: #fff;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      .calculator { padding: 15px; }
      button { font-size: 1.1rem; padding: 14px; }
      #display { font-size: 1.4rem; padding: 14px; }
    }
  </style>
</head>
<body>
  <div id="flash"></div>
  <div class="calculator-container">
    <div class="calculator">
      <input type="text" id="display" readonly aria-label="Calculator display" />
      <div class="buttons">
        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('/')">÷</button>
        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('*')">×</button>
        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('-')">−</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button onclick="append('+')">+</button>
        <button class="clear-btn" onclick="clearDisplay()">C</button>
        <button class="equal-btn" onclick="calculate()">=</button>
      </div>
      <div class="multo-lyrics" id="lyrics"></div>
      <div class="dark-toggle" onclick="toggleDark()">💀 Toggle Darkness</div>
      <div id="history" class="history-box">
        <h4>👻 Calculator History</h4>
        <ul id="historyList"></ul>
        <button onclick="clearHistory()">🗑 Clear History</button>
      </div>
      <img src="Sad.webp" class="ghost" id="ghost" alt="Ghost" />
      <audio id="multoMusic" src="Multo.mp3" preload="auto" loop></audio>
      <audio id="ambient" src="ambient.mp3" preload="auto" loop></audio>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    const lyricsEl = document.getElementById("lyrics");
    const ghost = document.getElementById("ghost");
    const music = document.getElementById("multoMusic");
    const ambient = document.getElementById("ambient");

    let resetTimer;

    function append(char) {
      display.value += char;
      triggerRandomEffect(char);
      autoResetTimer();
    }

    function triggerRandomEffect(char) {
      if (["1", "6", "9"].includes(char)) {
        new Audio("whisper.mp3").play();
        document.body.classList.add("shake");
        setTimeout(() => document.body.classList.remove("shake"), 300);
      }
    }

    function backspace() {
      display.value = display.value.slice(0, -1);
    }

    function clearDisplay() {
      display.value = "";
      lyricsEl.style.display = "none";
      ghost.style.display = "none";
      document.body.classList.remove("haunted");
      display.classList.remove("glitch");
      music.pause();
      music.currentTime = 0;
      clearTimeout(resetTimer);
    }

    function flashLightning() {
      const flash = document.getElementById("flash");
      flash.style.opacity = 1;
      setTimeout(() => flash.style.opacity = 0, 100);
    }

    function typewriterLyrics(text, i = 0) {
      if (i < text.length) {
        lyricsEl.innerHTML += text.charAt(i);
        setTimeout(() => typewriterLyrics(text, i + 1), 50);
      }
    }

    function saveToHistory(entry) {
      let history = JSON.parse(localStorage.getItem("hauntedHistory")) || [];
      history.unshift(entry);
      if (history.length > 5) history.pop();
      localStorage.setItem("hauntedHistory", JSON.stringify(history));
      loadHistory();
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem("hauntedHistory")) || [];
      const list = document.getElementById("historyList");
      list.innerHTML = "";
      history.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        list.appendChild(li);
      });
    }

    function clearHistory() {
      localStorage.removeItem("hauntedHistory");
      loadHistory();
    }

    function calculate() {
      const val = display.value;

      if (val.includes("666")) {
        new Audio("scream.mp3").play();
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      } else if (val === "12345") {
        alert("Misteryo ng calculator!");
      }

      flashLightning();
      display.value = "MULTO!";
      display.classList.add("glitch");
      document.body.classList.add("haunted");
      ghost.style.display = "block";

      lyricsEl.innerHTML = "";
      lyricsEl.style.display = "block";
      typewriterLyrics("Hindi na makalaya...\n Dinadalaw mo 'ko bawat gabi Wala mang nakikita....");

      music.play();
      ambient.play();

      saveToHistory(val + " = MULTO!");
    }

    function autoResetTimer() {
      clearTimeout(resetTimer);
      resetTimer = setTimeout(clearDisplay, 20000);
    }

    function toggleDark() {
      document.body.classList.toggle("haunted");
    }

    document.addEventListener("keydown", (e) => {
      if ("0123456789/*-+.".includes(e.key)) append(e.key);
      else if (e.key === "Enter") calculate();
      else if (e.key === "Backspace") backspace();
      else if (e.key === "Escape") clearDisplay();
    });

    window.onload = () => {
      loadHistory();
    };
  </script>
</body>
</html>
